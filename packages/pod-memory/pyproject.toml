[project]
name = "pod-memory"
version = "0.1.0"
description = "ChromaDB client, indexer, and retriever for target repo semantic memory"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.6.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pod_memory"]