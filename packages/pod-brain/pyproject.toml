[project]
name = "pod-brain"
version = "0.1.0"
description = "LangGraph orchestration engine for Agentic DevStudio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph-checkpoint-sqlite>=0.1.0",
    "chromadb>=0.6.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
postgres = [
    "langgraph-checkpoint-postgres>=0.1.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "anyio>=4.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pod_brain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires Docker stack (deselect with -m 'not integration')"]
